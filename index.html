<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-CORE // ESP32 RELAY CONTROL</title>
  <style>
    :root {
      --bg-color: #080c14;
      --metal-base: #1a2233;
      --metal-border: #334466;
      --blue-metal-start: #0a2540;
      --blue-metal-end: #001020;
      --blue-neon: #00f0ff;
      --red-metal-start: #5a0a0a;
      --red-metal-end: #200000;
      --red-neon: #ff2a2a;
      --text-main: #d0e6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(10, 37, 64, 0.4) 0%, transparent 80%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Panel Principal Robótico */
    .robot-panel {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(145deg, #161f30, #0c1322);
      border: 2px solid var(--metal-border);
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 
        0 0 30px rgba(0, 0, 0, 0.9),
        inset 0 0 15px rgba(0, 240, 255, 0.1),
        0 0 15px rgba(0, 240, 255, 0.2);
      position: relative;
      clip-path: polygon(
        0 15px, 15px 0, 
        calc(100% - 15px) 0, 100% 15px, 
        100% calc(100% - 15px), calc(100% - 15px) 100%, 
        15px 100%, 0 calc(100% - 15px)
      );
    }

    /* Remaches metálicos de adorno */
    .bolt {
      position: absolute;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle at 30% 30%, #88aacc, #223344);
      border-radius: 50%;
      box-shadow: 0 0 2px #000;
    }
    .bolt.tl { top: 8px; left: 8px; }
    .bolt.tr { top: 8px; right: 8px; }
    .bolt.bl { bottom: 8px; left: 8px; }
    .bolt.br { bottom: 8px; right: 8px; }

    /* Encabezado */
    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 15px;
    }

    .header h1 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 8px var(--blue-neon);
      margin-bottom: 5px;
    }

    .header .subtitle {
      font-size: 0.75rem;
      color: #6688aa;
      letter-spacing: 2px;
    }

    /* Pantalla de Estado */
    .status-display {
      background: #040810;
      border: 1px solid #1a334e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .status-info {
      text-align: left;
    }

    .status-label {
      font-size: 0.7rem;
      color: #557799;
      letter-spacing: 1px;
    }

    .status-val {
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: 4px;
      color: #557799;
      transition: all 0.3s ease;
    }

    /* Indicador LED Neón */
    .led-indicator {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #333;
      box-shadow: inset 0 0 5px #000;
      transition: all 0.3s ease;
    }

    .led-indicator.active-on {
      background: var(--blue-neon);
      border-color: #ffffff;
      box-shadow: 0 0 15px var(--blue-neon), 0 0 30px var(--blue-neon);
    }

    .led-indicator.active-off {
      background: var(--red-neon);
      border-color: #ffffff;
      box-shadow: 0 0 15px var(--red-neon), 0 0 30px var(--red-neon);
    }

    /* Botones Metalizados */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .btn-metal {
      position: relative;
      padding: 20px 10px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      border: none;
      cursor: pointer;
      outline: none;
      border-radius: 6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      transition: all 0.15s ease;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .btn-metal:active {
      transform: scale(0.96);
    }

    /* Botón ON - Azul Metalizado */
    .btn-blue {
      background: linear-gradient(135deg, #1e5799 0%, #207cca 40%, #0a2540 100%);
      border-top: 2px solid #4ca6ff;
      border-left: 2px solid #4ca6ff;
      box-shadow: 
        0 6px 0 #001020,
        0 8px 15px rgba(0, 0, 0, 0.7),
        inset 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .btn-blue:hover {
      box-shadow: 
        0 6px 0 #001020,
        0 0 20px rgba(0, 240, 255, 0.6),
        inset 0 0 15px rgba(0, 240, 255, 0.8);
    }

    /* Botón OFF - Rojo Metalizado */
    .btn-red {
      background: linear-gradient(135deg, #a71d1d 0%, #e62e2e 40%, #400000 100%);
      border-top: 2px solid #ff7373;
      border-left: 2px solid #ff7373;
      box-shadow: 
        0 6px 0 #1a0000,
        0 8px 15px rgba(0, 0, 0, 0.7),
        inset 0 0 10px rgba(255, 42, 42, 0.5);
    }

    .btn-red:hover {
      box-shadow: 
        0 6px 0 #1a0000,
        0 0 20px rgba(255, 42, 42, 0.6),
        inset 0 0 15px rgba(255, 42, 42, 0.8);
    }

    /* Pie de panel */
    .footer-status {
      margin-top: 25px;
      font-size: 0.65rem;
      color: #446688;
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="robot-panel">
    <!-- Remaches estéticos -->
    <div class="bolt tl"></div>
    <div class="bolt tr"></div>
    <div class="bolt bl"></div>
    <div class="bolt br"></div>

    <!-- Encabezado -->
    <div class="header">
      <h1>ESP32 CYBER-LINK</h1>
      <div class="subtitle">REALTIME RELAY CONTROLLER</div>
    </div>

    <!-- Pantalla de Estado -->
    <div class="status-display">
      <div class="status-info">
        <div class="status-label">ESTADO DEL SISTEMA</div>
        <div id="statusText" class="status-val">CONECTANDO...</div>
      </div>
      <div id="ledIndicator" class="led-indicator"></div>
    </div>

    <!-- Controles Robóticos -->
    <div class="controls-grid">
      <button class="btn-metal btn-blue" onclick="sendPulse(true)">
        POWER ON
      </button>
      <button class="btn-metal btn-red" onclick="sendPulse(false)">
        POWER OFF
      </button>
    </div>

    <div class="footer-status">
      DATABASE: eps32logo-default-rtdb // PROTOCOL: REALTIME STREAM
    </div>
  </div>

  <!-- SDKs de Firebase (v8 Compat para rápida ejecución en navegador) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    // Configuración conectada directamente a tu base de datos Firebase
    const firebaseConfig = {
      databaseURL: "https://eps32logo-default-rtdb.firebaseio.com/"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const relayRef = database.ref('/estadoRelay');

    // Elementos del DOM
    const statusText = document.getElementById('statusText');
    const ledIndicator = document.getElementById('ledIndicator');

    // Sintetizador de audio para feedback cibernético
    function playBeep(freq, type = 'sine') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        // Soporte si la reproducción de audio está bloqueada antes de interactuar
      }
    }

    // Función para enviar orden a Firebase
    function sendPulse(value) {
      if (value) {
        playBeep(880, 'square'); // Tono agudo para ON
      } else {
        playBeep(220, 'sawtooth'); // Tono grave para OFF
      }

      relayRef.set(value)
        .catch(error => {
          console.error("Error al actualizar estado en Firebase:", error);
          statusText.innerText = "ERROR DB";
          statusText.style.color = "#ff2a2a";
        });
    }

    // Escuchar cambios en tiempo real desde Firebase
    relayRef.on('value', (snapshot) => {
      const state = snapshot.val();
      
      if (state === true) {
        statusText.innerText = "ACTIVO [ON]";
        statusText.style.color = "var(--blue-neon)";
        statusText.style.textShadow = "0 0 10px var(--blue-neon)";
        ledIndicator.className = "led-indicator active-on";
      } else if (state === false) {
        statusText.innerText = "INACTIVO [OFF]";
        statusText.style.color = "var(--red-neon)";
        statusText.style.textShadow = "0 0 10px var(--red-neon)";
        ledIndicator.className = "led-indicator active-off";
      } else {
        statusText.innerText = "STANDBY";
        statusText.style.color = "#557799";
        statusText.style.textShadow = "none";
        ledIndicator.className = "led-indicator";
      }
    });
  </script>
</body>
</html>
